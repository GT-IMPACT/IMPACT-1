# Configuration file

general {
    # Size of one balanced generation area in vein cells per axis. Larger values improve weight distribution accuracy but make balance repeat over a larger area [range: 8 ~ 1024, default: 128]
    I:balanceAreaVeins=128

    # Count Water For HP Drilling Fluids [range: 0 ~ 10000, default: 1000]
    I:countWaterForHPDrill=0

    # Count Water For LP Drilling Fluids [range: 0 ~ 100, default: 10]
    I:countWaterForLPDrill=0

    # Count Water For MP Drilling Fluids [range: 0 ~ 1000, default: 100]
    I:countWaterForMPDrill=0

    # Virtual empty entry weight used by balanced resource generation. Higher value increases chance that no ore/fluid vein is generated. [range: 0.0 ~ 50.0, default: 2.0]
    S:emptyWeight=16.0

    # Enabled Debug Mode [default: false]
    B:enableDebug=false

    # Enabled Test Resources [default: false]
    B:hasTestResources=false
    B:isDisabledScannerTool=false
    B:isDisabledVirtualFluids=false
    B:isDisabledVirtualOres=false

    # Maximum number of generated regions kept in memory cache. [range: 16 ~ 1024, default: 256]
    I:maxCachedRegions=256
    I:maxSizeRegisteredVirtualFluids=200
    I:maxSizeRegisteredVirtualOres=200

    # Discharge amount scanner per operation [range: 0 ~ 1000000, default: 100000]
    I:scannerDischargeAmount=100000
}


